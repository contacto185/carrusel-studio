services:
  - type: web
    name: carrusel-studio-backend
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_ACCESS_KEY
        sync: false
      - key: LOVART_ACCESS_KEY
        sync: false
      - key: LOVART_SECRET_KEY
        sync: false
      - key: LOVART_PROJECT_ID
        sync: false
      - key: LOVART_IMAGE_MODEL
        value: generate_image_seedream_v5_pro
      - key: GHL_PIT
        sync: false
      - key: GHL_LOCATION_ID
        value: vO5OEozodrPXZ8gRugCP
      - key: GHL_USER_ID
        value: 7KAVILuYzaJAwve0c6Fd
      - key: GHL_API_VERSION
        value: 2021-07-28
      - key: GHL_DEFAULT_ACCOUNT_IDS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-4-5
      - key: ALLOWED_ORIGINS
        value: "*"

  # Generación automática diaria (9:00 AM Chile = 13:00 UTC). Ajusta el cron si cambia el horario.
  - type: cron
    name: carrusel-studio-daily
    runtime: python
    schedule: "0 13 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python3 scheduler.py
    envVars:
      - key: LOVART_ACCESS_KEY
        sync: false
      - key: LOVART_SECRET_KEY
        sync: false
      - key: LOVART_PROJECT_ID
        sync: false
      - key: GHL_PIT
        sync: false
      - key: GHL_LOCATION_ID
        value: vO5OEozodrPXZ8gRugCP
      - key: GHL_USER_ID
        value: 7KAVILuYzaJAwve0c6Fd
      - key: GHL_DEFAULT_ACCOUNT_IDS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
